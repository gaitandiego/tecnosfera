<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de noticias — Tecnosfera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="site">

  <!-- Encabezado -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">TECNOSFERA</a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="news.html">Noticias</a>
        <a href="favorites.html">Favoritos<span class="nav-counter"></span></a>
        <a href="contact.html">Contacto</a>
        <a href="admin.html" class="is-active">Gestión</a>
      </nav>
      <div class="header__user">
        <span id="current-user"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="logout-button"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container page-head page-head--row">
      <div>
        <h1>Gestión de noticias</h1>
        <p>Crear y eliminar noticias del portal.</p>
      </div>
    </div>

    <section class="container admin-grid">

      <div class="table-card">
        <table class="table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoría</th>
              <th class="col-action">Acción</th>
            </tr>
          </thead>
          <tbody id="articles-table"></tbody>
        </table>

        <div class="alert alert--danger" id="delete-confirm" hidden></div>
      </div>

      <div class="panel admin-form">
        <h3>Nueva noticia</h3>
        <form class="form" id="article-form" novalidate>

          <div class="field">
            <label for="title">Título *</label>
            <input type="text" id="title" name="title" class="input" required placeholder="Escribe el titular…">
          </div>

          <div class="field">
            <label for="category">Categoría *</label>
            <select id="category" name="category" class="select" required></select>
          </div>

          <div class="field">
            <label for="image">Imagen</label>
            <input type="text" id="image" name="image" class="input" placeholder="img/news-01.svg">
          </div>

          <div class="field">
            <label for="summary">Descripción breve *</label>
            <textarea id="summary" name="summary" class="textarea" required placeholder="Resumen para la tarjeta…"></textarea>
          </div>

          <div class="field">
            <label for="content">Contenido completo *</label>
            <textarea id="content" name="content" class="textarea textarea--tall" required placeholder="Cuerpo de la noticia…"></textarea>
          </div>

          <div class="form__buttons">
            <button type="submit" class="btn btn--primary btn--block"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
            <button type="reset" class="btn btn--ghost">Cancelar</button>
          </div>

          <div class="alert alert--ok" id="article-created" hidden>
            <i class="fa-solid fa-circle-check"></i> Noticia creada correctamente
          </div>

        </form>
      </div>

    </section>
  </main>

  <!-- Pie de página -->
  <footer class="footer">
    <div class="container footer__inner">
      <span>Tecnosfera © 2026 — Noticias de tecnología</span>
      <span>
        <a href="index.html">Inicio</a> ·
        <a href="news.html">Noticias</a> ·
        <a href="favorites.html">Favoritos</a> ·
        <a href="contact.html">Contacto</a>
      </span>
    </div>
  </footer>

</div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
